name: Compile JS

on:
  workflow_call:
    inputs:
      input-file:
        description: Path (in the calling repo) to the .js/.bjs script to compile.
        required: true
        type: string
      output-file:
        description: Output .bin path. Defaults to input-file with its extension replaced by .bin.
        required: false
        type: string
        default: ""
      image-tag:
        description: Tag of ghcr.io/brucedevices/compile-js to use.
        required: false
        type: string
        default: latest
    outputs:
      output-file:
        description: Resolved path of the compiled .bin file.
        value: ${{ jobs.compile.outputs.output-file }}

jobs:
  compile:
    runs-on: ubuntu-latest
    outputs:
      output-file: ${{ steps.compile.outputs.output-file }}
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        id: compile
        shell: bash
        run: |
          set -e
          IN="${{ inputs.input-file }}"
          OUT="${{ inputs.output-file }}"
          if [ -z "$OUT" ]; then
            OUT="${IN%.*}.bin"
          fi
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            "ghcr.io/brucedevices/compile-js:${{ inputs.image-tag }}" \
            "$IN" "$OUT"
          echo "output-file=$OUT" >> "$GITHUB_OUTPUT"
